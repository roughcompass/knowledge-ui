# =============================================================================
# knowledge-ui CI
# =============================================================================
# Every job runs one `ci:*` npm script and nothing else, so the pipeline is the
# same set of commands on a laptop as it is here. `npm run ci` runs all five in
# order; each `ci:<lane>` runs one of them.
#
# That claim used to be aspirational. Four checks lived only in this file —
# formatting, codegen drift, the end-to-end lane, and the dev-secret assertion —
# so `npm run ci` could pass locally while CI failed on any of them. The lanes
# below are the fix: there is no step here that is not also a script.
#
# The jobs stay split rather than collapsing into one `npm run ci` call, because
# they parallelise and report separately. The composition lives in package.json.
#
# The end-to-end lane runs against a build with the request mocks compiled in,
# so it needs no registry, no database and no identity provider. That is a
# deliberate property: a UI repo whose tests only pass when a backend happens
# to be running is a repo whose tests do not get run.
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint, types, guards, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # eslint (including the token and design rules), stylelint's Salt-token
      # allow-list, project-wide typecheck, the four guard scripts, and
      # formatting. A rule set to warn cannot pass this: `lint` runs with
      # --max-warnings 0.
      - run: npm run ci:static

  codegen-drift:
    name: openapi codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The spec is vendored rather than read across the repo boundary, so the
      # generated bindings must match the vendored copy. Drift against the live
      # registry is caught by the live end-to-end lane instead.
      - run: npm run ci:codegen

  unit:
    name: unit and component tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:unit

  e2e:
    name: end to end (mocked backend)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Pinned to the installed @playwright/test rather than floating: a browser
      # from a different version than the test runner is a class of failure that
      # reproduces nowhere else.
      - run: npx playwright@1.62.1 install --with-deps chromium
      # Builds all three artefacts with the remote URLs wired, runs the mocked
      # project, then budgets the federated graph. Real Module Federation is only
      # exercised here — the unit suite aliases the boundary away — and no
      # manualChunks is possible under it, so the bundle budget is the only
      # remaining guard against size regression.
      - run: npm run ci:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  no-dev-secrets:
    name: no dev secrets in the production bundle
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production-builds all three artefacts and asserts the persona roster was
      # elided — it carries dev client credentials, and a bundler change that
      # defeated the elision would ship them with no other symptom. The check
      # also fails when the build output is absent, because the shell `grep` it
      # replaced treated a missing directory as a clean one.
      - run: npm run ci:secrets
